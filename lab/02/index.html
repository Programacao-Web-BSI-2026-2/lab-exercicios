<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Suporte Técnico — Refatorado</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        form { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 1.5rem; border-radius: 8px; }
        fieldset { border: 1px solid #475569; border-radius: 6px; padding: 1rem; }
        legend { color: #38bdf8; font-weight: bold; padding: 0 0.5rem; }
        .group { display: flex; flex-direction: column; margin-bottom: 1rem; }
        label { margin-bottom: 0.3rem; font-size: 0.9rem; }
        input, select { background: #090d16; border: 1px solid #475569; color: #fff; padding: 0.5rem; border-radius: 4px; }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        .hint { color: #94a3b8; font-size: 0.75rem; margin-top: 0.2rem; }
        button { background: #38bdf8; color: #000; font-weight: bold; border: none; padding: 0.7rem 1.2rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Endpoint público httpbin.org para teste imediato no navegador -->
    <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
        <fieldset>
            <legend>Abrir Chamado Técnico</legend>

            <div class="group">
                <label for="nome-usuario">Nome Completo: *</label>
                <input type="text" id="nome-usuario" name="nome" required minlength="3">
            </div>

            <div class="group">
                <label for="email-usuario">E-mail de Contato: *</label>
                <input type="email" id="email-usuario" name="email" placeholder="nome@empresa.com" required>
            </div>

            <div class="group">
                <label for="prioridade-chamado">Nível de Prioridade: *</label>
                <select id="prioridade-chamado" name="prioridade" required>
                    <option value="">-- Selecione --</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </div>

            <div class="group">
                <label for="anexo-log">Arquivo de Log ou Print (PNG ou PDF): *</label>
                <input type="file" id="anexo-log" name="anexo" accept="image/png,application/pdf" required aria-describedby="anexo-help">
                <span id="anexo-help" class="hint">Apenas arquivos do tipo .png ou .pdf são permitidos.</span>
            </div>

            <button type="submit">Enviar Chamado</button>
        </fieldset>
    </form>

</body>
</html>
